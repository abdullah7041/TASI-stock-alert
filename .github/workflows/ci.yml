name: CI

# Separate from tasi.yml on purpose. tasi.yml is the scheduled trading job and
# fires ~21 times a trading day; a Node install and a Vite build there would
# cost minutes per run for code `python main.py` never executes. This workflow
# runs on code changes instead. The scheduled job's own state commits carry
# "[skip ci]", so they do not trigger it.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # test_runtime.py asserts on the committed workflow and Cloud Scheduler
      # definitions, so workflow validation rides in the same job rather than
      # needing a separate linter.
      - name: Validate scheduled runtime modules
        run: python -m compileall -q main.py movement.py session_gate.py runtime research
      - name: Tests
        run: python -m pytest test_core.py test_alert_names.py test_runtime.py research/test_base_rate.py research/test_entry_forecast.py research/test_event_study.py research/test_official_sources.py -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # package.json declares engines.node ">=22.13.0". A range, not an
          # exact pin: pinning 22.13.0 here would freeze CI on the oldest
          # supported release forever.
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # `npm test` runs `npm run build` first: tests/action-cockpit.test.mjs
      # imports ../dist/server/index.js, so the build is a prerequisite, not
      # a duplicate step. It then runs the jsdom component tests (`test:ui`),
      # which render the cockpit and drive it with real clicks and keys.
      - name: Build and test
        run: npm test
      - name: Check repository patch integrity
        run: git diff --check

  # The producer writes dashboard.json and the cockpit parses it, in different
  # languages, in different repos' worth of code. Nothing checked that they
  # agreed -- so they stopped agreeing, and it surfaced in production as an
  # HTTP 400 on every ingest with the reason invisible. Checking the committed
  # artifact is not enough either: that file was written by older code than the
  # producer that will send the next one. This job builds a snapshot from the
  # CURRENT producer and hands it to the site's own parser.
  producer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Emit a snapshot from the current producer
        run: python scripts/emit_sample_snapshot.py fresh-dashboard.json
      - name: Parse it with the cockpit's own parser
        env:
          DASHBOARD_SNAPSHOT_PATH: fresh-dashboard.json
        run: node --test tests/producer-contract.test.mjs
