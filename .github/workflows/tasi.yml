name: TASI alerts

on:
  schedule:
    # Every 10 min, 07:00-11:59 UTC (10:00-14:55 Riyadh), Sunday-Thursday.
    # GitHub cron is UTC and can be delayed a few minutes under load.
    - cron: "*/10 7-11 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "heartbeat or suggest (leave blank for normal run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_MODE: ${{ vars.DATA_MODE || 'realtime' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "heartbeat" ]; then
            python main.py --heartbeat
          elif [ "${{ github.event.inputs.mode }}" = "suggest" ]; then
            python main.py --suggest
          else
            python main.py
          fi

      - name: Persist alert state
        if: github.event.inputs.mode == ''
        run: |
          git config user.name "tasi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json symbols.json levels.json 2>/dev/null || true
          git commit -m "update state [skip ci]" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "nothing to push"
