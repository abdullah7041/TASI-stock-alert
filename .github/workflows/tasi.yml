name: TASI recommender

# Times are UTC. TASI trades 10:00-15:00 Riyadh = 07:00-12:00 UTC, Sun-Thu.
# Cron day-of-week: Sunday=0 ... Thursday=4.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which mode to run"
        required: true
        default: "run"
        # A choice, not free text. As a plain string input GitHub renders a box
        # pre-filled with "run", so dispatching any other mode meant typing it
        # exactly and a typo silently ran the default instead.
        type: choice
        options:
          - run
          - digest
          - digest-guard
          - intraday-probe
          - market-pulse
          - heartbeat
          - discord-smoke
          - suggest
          - autolevels
          - reconcile
          - top10-draft
          - cockpit-refresh
          - research-evidence
  schedule:
    # Pre-open digest at 05:30 UTC (08:30 Riyadh), Sun-Thu.
    #
    # It was 06:45 UTC (09:45 Riyadh) until 2026-08-25. Measured lateness on the
    # GitHub scheduler over the preceding week was 35, 39, 40, 42, 44, 49 and 59
    # minutes, which put every "pre-open" digest 20-45 minutes AFTER the 10:00
    # open -- and a slip past 60 minutes killed the run outright. 05:30 buys ~90
    # minutes of headroom against the same drift.
    - cron: "30 5 * * 0,1,2,3,4"
    # Guard rail at 06:10 UTC (09:10 Riyadh). Sends the digest only if the
    # 05:30 trigger was dropped or is still queued; a no-op on a normal day.
    - cron: "10 6 * * 0,1,2,3,4"
    # Session checks every 15 min, 07:00-11:59 UTC (10:00-14:59 Riyadh), Sun-Thu.
    - cron: "*/15 7-11 * * 0,1,2,3,4"
    # Post-close reconciliation at 12:15 UTC (15:15 Riyadh), Sun-Thu. Grades the
    # previous session's pre-open leans against what the price actually did.
    - cron: "15 12 * * 0,1,2,3,4"
    # A review draft is created only when its 3-calendar-month date is due.
    - cron: "30 12 * * 0,1,2,3,4"
    # Wednesday 08:15 Riyadh official-source evidence collection. Review is still required.
    - cron: "15 5 * * 3"

permissions:
  contents: write   # to commit state.json / levels.json back.

concurrency:
  # One queue per trigger, not one queue for the whole workflow. A single shared
  # group made the pre-open digest wait behind the every-15-minute session runs,
  # which was a large part of why it kept landing after the open.
  #
  # The one exception is the digest and its backstop, which SHARE a queue. The
  # backstop decides from the dashboard.json the digest commits in its last
  # step, so letting them overlap means the backstop reads a stale trade date
  # while the real digest is still running -- and sends the whole thing twice.
  group: tasi-${{ (github.event.schedule == '30 5 * * 0,1,2,3,4' || github.event.schedule == '10 6 * * 0,1,2,3,4' || github.event.inputs.mode == 'digest-guard') && 'pre-open' || github.event.schedule || github.event.inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate scheduled runtime
        run: python -m compileall -q main.py movement.py session_gate.py research

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=manual" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * 0,1,2,3,4" ]; then
            echo "mode=digest-guard" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T05:30:00Z" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 6 * * 0,1,2,3,4" ]; then
            echo "mode=digest-guard" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T06:10:00Z" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 12 * * 0,1,2,3,4" ]; then
            echo "mode=reconcile" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T12:15:00Z" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 12 * * 0,1,2,3,4" ]; then
            echo "mode=top10-draft" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T12:30:00Z" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 5 * * 3" ]; then
            echo "mode=research-evidence" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T05:15:00Z" >> "$GITHUB_OUTPUT"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
            echo "scheduled_for=$(date -u +%F)T07:00:00Z" >> "$GITHUB_OUTPUT"
          fi
          echo "actual_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refresh canonical state for a queued guard
        if: steps.mode.outputs.mode == 'digest-guard'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Check production delivery guard
        id: delivery_guard
        if: steps.mode.outputs.mode == 'digest-guard'
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          cockpit_auth_ready
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .guard-dashboard.json -w '%{http_code}' \
            "${COCKPIT_AUTH_HEADERS[@]}" "$COCKPIT_ORIGIN/api/dashboard")
          case "$STATUS" in
            2??) ;;
            *) echo "::error::production delivery authority returned HTTP $STATUS"; exit 1;;
          esac
          GUARD_STATE=$(node scripts/delivery-guard.mjs .guard-dashboard.json "$(date -u +%F)")
          if [ "$GUARD_STATE" = "unknown" ]; then
            echo "::error::production delivery authority returned an invalid response"
            exit 1
          fi
          DELIVERED=false
          if [ "$GUARD_STATE" = "delivered" ]; then DELIVERED=true; fi
          echo "delivered=$DELIVERED" >> "$GITHUB_OUTPUT"
          echo "production_delivery_guard_state=$GUARD_STATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Load approved Top 10 for producer
        if: contains('digest,digest-guard,top10-draft,cockpit-refresh,reconcile', steps.mode.outputs.mode)
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          # Fail soft. This step used to hard-assert both secrets with no
          # continue-on-error, so a missing secret killed the digest before
          # python ever ran -- the day's analysis lost to an optional preload.
          if ! cockpit_auth_ready; then
            echo "cockpit tokens absent; continuing without an approved Top 10"
            printf '%s\n' '{"approved":null}' > .top10-current.json
          elif ! curl --fail --silent --show-error "${COCKPIT_AUTH_HEADERS[@]}" "$COCKPIT_ORIGIN/api/top10/current" > .top10-current.json; then
            printf '%s\n' '{"approved":null}' > .top10-current.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(".top10-current.json").read_text(encoding="utf-8"))
          active = payload.get("approved")
          target = Path("top10_active.json")
          if isinstance(active, dict) and active.get("entries"):
              target.write_text(json.dumps(active, ensure_ascii=False, indent=2), encoding="utf-8")
          elif target.exists():
              target.unlink()
          PY

      - name: Load reviewed evidence for Top 10 drafting
        if: steps.mode.outputs.mode == 'top10-draft'
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
        run: |
          rm -f research/evidence.json .evidence-current.json
          if [ -z "$COCKPIT_SIWC_BYPASS_TOKEN" ] || [ -z "$COCKPIT_INGEST_TOKEN" ]; then
            echo "cockpit tokens absent; no reviewed evidence is available"
            exit 0
          fi
          if ! curl --fail --silent --show-error \
              -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" \
              -H "Authorization: Bearer $COCKPIT_INGEST_TOKEN" \
              https://tasi-action-cockpit.busaud7041.chatgpt.site/api/evidence/current \
              > .evidence-current.json; then
            echo "reviewed evidence read failed; leaving Top 10 evidence unavailable"
            rm -f .evidence-current.json
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(".evidence-current.json").read_text(encoding="utf-8"))
          records = payload.get("records") if isinstance(payload, dict) else None
          if isinstance(records, list):
              Path("research/evidence.json").write_text(json.dumps(records, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Load the confirmed portfolio for producer
        # What you own and what you have spent are recorded by you, in the
        # cockpit ledger. Decision-producing workflows fail closed when that
        # authority cannot be read; stale config holdings must not drive advice.
        if: contains('run,digest,digest-guard,suggest,autolevels,top10-draft,intraday-probe', steps.mode.outputs.mode)
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          rm -f portfolio_active.json
          cockpit_auth_ready
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            "${COCKPIT_AUTH_HEADERS[@]}" \
            "$COCKPIT_ORIGIN/api/portfolio/current" \
            > .portfolio-current.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(".portfolio-current.json").read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("view"), dict):
              raise RuntimeError("Confirmed portfolio ledger response is invalid.")
          if (isinstance(payload.get("eventCount"), bool)
                  or not isinstance(payload.get("eventCount"), int)
                  or payload["eventCount"] <= 0):
              raise RuntimeError("Confirmed portfolio ledger requires an imported opening balance.")
          Path("portfolio_active.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Run
        id: run
        # State must survive a delivery failure. The final step restores the
        # failure after Commit state has persisted it.
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_PUBLIC_URL: ${{ vars.COCKPIT_PUBLIC_URL }}
          SCHEDULED_FOR: ${{ steps.mode.outputs.scheduled_for }}
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. Absent, Gemini is explicitly unavailable while delayed
          # deterministic facts and Discord delivery continue normally.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASI_LLM_PROVIDERS: ${{ vars.TASI_LLM_PROVIDERS }}
          TASI_LLM_MODEL_OPENROUTER: ${{ vars.TASI_LLM_MODEL_OPENROUTER }}
          TASI_LLM_MODEL_GEMINI: ${{ vars.TASI_LLM_MODEL_GEMINI }}
          TASI_PRODUCTION_DELIVERED: ${{ steps.delivery_guard.outputs.delivered }}
          TASI_REQUIRE_PORTFOLIO_LEDGER: ${{ contains('run,digest,digest-guard,suggest,autolevels,top10-draft,intraday-probe', steps.mode.outputs.mode) && 'true' || 'false' }}
        run: python main.py

      - name: Record job telemetry
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SCHEDULED_FOR: ${{ steps.mode.outputs.scheduled_for }}
          ACTUAL_UTC: ${{ steps.mode.outputs.actual_utc }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          print(f"mode={os.environ['MODE']}")
          print(f"commit={os.environ['GITHUB_SHA']}")
          print(f"scheduled_for={os.environ['SCHEDULED_FOR']}")
          print(f"actual_utc={os.environ['ACTUAL_UTC']}")
          if Path("dashboard.json").exists():
              snapshot = json.loads(Path("dashboard.json").read_text(encoding="utf-8"))
              print(f"dashboard_as_of={snapshot.get('asOf')}")
              print(f"snapshot_schema={snapshot.get('schemaVersion')}")
              lean = snapshot.get("leanStatus")
              if isinstance(lean, dict):
                  print(f"lean_provider={lean.get('provider')}")
                  print(f"lean_model={lean.get('model')}")
                  print(f"lean_error_type={lean.get('errorType')}")
                  print(f"lean_http_status={lean.get('httpStatus')}")
                  print(f"lean_error_category={lean.get('errorCategory')}")
          if Path("movement_alerts.json").exists():
              alerts = json.loads(Path("movement_alerts.json").read_text(encoding="utf-8"))
              print(f"movement_alert_count={len(alerts.get('alerts') or [])}")
          PY

      - name: Persist official evidence review queue
        if: steps.mode.outputs.mode == 'research-evidence' && steps.run.outcome == 'success'
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
        run: |
          if [ -z "$COCKPIT_SIWC_BYPASS_TOKEN" ] || [ -z "$COCKPIT_INGEST_TOKEN" ] || [ ! -f research/evidence_queue.json ]; then
            echo "review queue was not persisted because it was unavailable or unauthenticated"
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" \
            -H "Authorization: Bearer $COCKPIT_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @research/evidence_queue.json \
            https://tasi-action-cockpit.busaud7041.chatgpt.site/api/evidence/queue/ingest

      - name: Compare canonical dashboard with production
        id: dashboard
        if: always() && steps.delivery_guard.outputs.delivered != 'true' && contains('digest,digest-guard,top10-draft,cockpit-refresh,reconcile', steps.mode.outputs.mode)
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          printf '%s\n' '{}' > .remote-dashboard.json
          if cockpit_auth_ready; then
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
              "${COCKPIT_AUTH_HEADERS[@]}" "$COCKPIT_ORIGIN/api/dashboard" \
              > .remote-dashboard.json || printf '%s\n' '{}' > .remote-dashboard.json
          fi
          NEEDED=$(node scripts/dashboard-replay.mjs "$MODE" dashboard.json .remote-dashboard.json)
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "dashboard_replay_needed=$NEEDED" >> "$GITHUB_STEP_SUMMARY"

      - name: Update private cockpit
        if: steps.dashboard.outputs.needed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          cockpit_auth_ready
          REPLAY_HEADERS=()
          if [ "$MODE" = "cockpit-refresh" ]; then
            REPLAY_HEADERS=(-H "x-tasi-replay-only: true")
          fi
          # --fail-with-body captured the reason into a variable and then aborted
          # under `set -e` before anything echoed it, so every 4xx read as a bare
          # "exit code 22". Capture the status separately and always print the body.
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .ingest-response.json -w '%{http_code}' \
            -X POST "$COCKPIT_ORIGIN/api/dashboard/ingest" \
            "${COCKPIT_AUTH_HEADERS[@]}" \
            "${REPLAY_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @dashboard.json)
          BODY=$(cat .ingest-response.json)
          echo "HTTP $STATUS: $BODY"
          printf 'mode=%s\ncommit=%s\ndashboard_ingest_status=%s\ndashboard_ingest_body=%s\n' "${{ steps.mode.outputs.mode }}" "$GITHUB_SHA" "$STATUS" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in 2??) ;; *) echo "::error::dashboard ingest rejected with HTTP $STATUS: $BODY"; exit 1;; esac

      # The owner-facing Sites publication owns a separate D1 database from the
      # machine gateway above. Keep the owner-facing cockpit current without
      # moving the producer's authenticated machine API or enabling pulse
      # ingestion. This runs independently of the gateway replay comparison so
      # a stale Sites database can recover even when the gateway is current.
      - name: Mirror daily dashboard to private Sites
        # Enable only after DASHBOARD_INGEST_TOKEN is configured in Sites.
        if: vars.SITES_DAILY_SYNC_ENABLED == 'true' && steps.run.outcome == 'success' && contains('digest,digest-guard,top10-draft,cockpit-refresh,reconcile', steps.mode.outputs.mode)
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
        run: |
          if [ -z "$COCKPIT_SIWC_BYPASS_TOKEN" ] || [ -z "$COCKPIT_INGEST_TOKEN" ]; then
            echo "Sites credentials are unavailable; the owner-facing dashboard was not synced."
            exit 1
          fi
          REPLAY_HEADERS=()
          if [ "$MODE" = "cockpit-refresh" ]; then
            REPLAY_HEADERS=(-H "x-tasi-replay-only: true")
          fi
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .sites-dashboard-ingest.json -w '%{http_code}' \
            -X POST "https://tasi-action-cockpit.busaud7041.chatgpt.site/api/dashboard/ingest" \
            -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" \
            -H "Authorization: Bearer $COCKPIT_INGEST_TOKEN" \
            "${REPLAY_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @dashboard.json)
          BODY=$(cat .sites-dashboard-ingest.json)
          echo "Sites dashboard ingest HTTP $STATUS: $BODY"
          printf 'sites_dashboard_ingest_status=%s\nsites_dashboard_ingest_body=%s\n' "$STATUS" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in 2??) ;; *) echo "::error::Sites dashboard ingest rejected with HTTP $STATUS: $BODY"; exit 1;; esac

      - name: Update delayed movement alerts
        if: steps.run.outcome == 'success' && steps.mode.outputs.mode == 'run'
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          cockpit_auth_ready
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .ingest-response.json -w '%{http_code}' \
            -X POST "$COCKPIT_ORIGIN/api/alerts/ingest" \
            "${COCKPIT_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @movement_alerts.json)
          BODY=$(cat .ingest-response.json)
          echo "HTTP $STATUS: $BODY"
          printf 'mode=run\ncommit=%s\nalert_ingest_status=%s\nalert_ingest_body=%s\n' "$GITHUB_SHA" "$STATUS" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in 2??) ;; *) echo "::error::alert ingest rejected with HTTP $STATUS: $BODY"; exit 1;; esac

      - name: Mirror movement alerts to private Sites
        if: vars.SITES_DAILY_SYNC_ENABLED == 'true' && steps.run.outcome == 'success' && steps.mode.outputs.mode == 'run'
        continue-on-error: true
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
        run: |
          if [ -z "$COCKPIT_SIWC_BYPASS_TOKEN" ] || [ -z "$COCKPIT_INGEST_TOKEN" ]; then
            echo "Sites credentials are unavailable; movement alerts were not synced."
            exit 1
          fi
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .sites-alert-ingest.json -w '%{http_code}' \
            -X POST "https://tasi-action-cockpit.busaud7041.chatgpt.site/api/alerts/ingest" \
            -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" \
            -H "Authorization: Bearer $COCKPIT_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @movement_alerts.json)
          BODY=$(cat .sites-alert-ingest.json)
          echo "Sites movement-alert ingest HTTP $STATUS: $BODY"
          printf 'sites_alert_ingest_status=%s\nsites_alert_ingest_body=%s\n' "$STATUS" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in 2??) ;; *) echo "::error::Sites movement-alert ingest rejected with HTTP $STATUS: $BODY"; exit 1;; esac

      - name: Report disabled market pulse ingestion
        if: always() && steps.run.outcome == 'success' && steps.mode.outputs.mode == 'run' && vars.TASI_PULSE_INGESTION_ENABLED != 'true'
        run: echo 'pulse_ingestion=disabled (requires separate owner authorization)' >> "$GITHUB_STEP_SUMMARY"

      - name: Update delayed market pulse
        if: always() && steps.run.outcome == 'success' && steps.mode.outputs.mode == 'run' && vars.TASI_PULSE_INGESTION_ENABLED == 'true'
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          cockpit_auth_ready
          STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -o .pulse-ingest-response.json -w '%{http_code}' \
            -X POST "$COCKPIT_ORIGIN/api/pulse/ingest" \
            "${COCKPIT_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            --data-binary @market_pulse.json)
          BODY=$(cat .pulse-ingest-response.json)
          echo "HTTP $STATUS: $BODY"
          printf 'mode=run\ncommit=%s\npulse_ingest_status=%s\npulse_ingest_body=%s\n' "$GITHUB_SHA" "$STATUS" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in 2??) ;; *) echo "::error::market pulse ingest rejected with HTTP $STATUS: $BODY"; exit 1;; esac

      - name: Record confirmed Discord delivery
        if: always() && steps.delivery_guard.outputs.delivered != 'true' && contains('digest,digest-guard,cockpit-refresh,reconcile', steps.mode.outputs.mode)
        env:
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
          COCKPIT_ORIGIN: ${{ vars.COCKPIT_ORIGIN }}
          COCKPIT_ACCESS_CLIENT_ID: ${{ secrets.COCKPIT_ACCESS_CLIENT_ID }}
          COCKPIT_ACCESS_CLIENT_SECRET: ${{ secrets.COCKPIT_ACCESS_CLIENT_SECRET }}
        run: |
          source .github/cockpit-auth.sh
          cockpit_auth_ready
          set +e
          python - <<'PY' > .discord-receipt.json
          import json, time
          from pathlib import Path
          payload = json.loads(Path("dashboard.json").read_text(encoding="utf-8"))
          discord = (payload.get("deliveries") or {}).get("discord") or {}
          if discord.get("status") != "success":
              raise SystemExit(78)
          print(json.dumps({"artifactId": payload["artifactId"], "destination": "discord", "status": "success", "attemptedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}))
          PY
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 78 ]; then
            echo "canonical artifact has no confirmed Discord delivery to recover" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-max-time 90 \
            -X POST "$COCKPIT_ORIGIN/api/deliveries/ingest" "${COCKPIT_AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" --data-binary @.discord-receipt.json >/dev/null

      - name: Commit state
        if: always()
        run: |
          git config user.name "tasi-bot"
          git config user.email "tasi-bot@users.noreply.github.com"
          # top10_active.json is deliberately absent: it is fetched fresh from
          # the cockpit each run and DELETED when that read fails, so committing
          # it would land a transient outage in the repo as a deletion of the
          # approved list. Same reasoning as portfolio_active.json in .gitignore.
          for path in state.json levels.json symbols.json news_archive.jsonl history.json dashboard.json top10_draft.json movement_state.json movement_alerts.json market_pulse.json budget_state.json llm_budget.json research/evidence_queue.json research/intraday_probe.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then git commit -m "state update [skip ci]"; fi
          git pull --rebase origin main
          git push

      - name: Fail if runtime failed
        if: always() && steps.run.outcome == 'failure'
        run: exit 1
