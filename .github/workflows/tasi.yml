name: TASI recommender

# Times are UTC. TASI trades 10:00-15:00 Riyadh = 07:00-12:00 UTC, Sun-Thu.
# Cron day-of-week: Sunday=0 ... Thursday=4.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "heartbeat | suggest | autolevels | digest | run"
        required: true
        default: "run"
  schedule:
    # Pre-open digest at 06:45 UTC (09:45 Riyadh), Sun-Thu.
    - cron: "45 6 * * 0,1,2,3,4"
    # Session checks every 15 min, 07:00-11:59 UTC (10:00-14:59 Riyadh), Sun-Thu.
    - cron: "*/15 7-11 * * 0,1,2,3,4"

permissions:
  contents: write   # to commit state.json / levels.json back.

concurrency:
  group: tasi-recommender
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 6 * * 0,1,2,3,4" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "tasi-bot"
          git config user.email "tasi-bot@users.noreply.github.com"
          git add state.json levels.json symbols.json news_archive.jsonl 2>/dev/null || true
          git commit -m "state update [skip ci]" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "nothing to push"
