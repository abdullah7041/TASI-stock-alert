name: Sites production smoke

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Commit recorded in the approved Sites release manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sites-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_commit_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate safe refresh payload
        env:
          MODE: cockpit-refresh
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: python main.py
      - name: Verify release and ingest safe snapshot
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          COCKPIT_SIWC_BYPASS_TOKEN: ${{ secrets.COCKPIT_SIWC_BYPASS_TOKEN }}
          COCKPIT_INGEST_TOKEN: ${{ secrets.COCKPIT_INGEST_TOKEN }}
        run: |
          test -n "$COCKPIT_SIWC_BYPASS_TOKEN"
          test -n "$COCKPIT_INGEST_TOKEN"
          HEALTH=$(curl --fail-with-body --retry 3 --retry-delay 2 https://tasi-action-cockpit.busaud7041.chatgpt.site/api/health -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN")
          echo "$HEALTH"
          printf '%s\n' "$HEALTH" > health-response.json
          INGEST=$(curl --fail-with-body --retry 3 --retry-delay 2 -X POST https://tasi-action-cockpit.busaud7041.chatgpt.site/api/dashboard/ingest -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" -H "Authorization: Bearer $COCKPIT_INGEST_TOKEN" -H "Content-Type: application/json" --data-binary @dashboard.json)
          echo "$INGEST"
          curl --fail-with-body --retry 3 --retry-delay 2 \
            https://tasi-action-cockpit.busaud7041.chatgpt.site/api/dashboard \
            -H "OAI-Sites-Authorization: Bearer $COCKPIT_SIWC_BYPASS_TOKEN" \
            -o dashboard-response.json
          python scripts/verify_production_smoke.py health-response.json dashboard-response.json "$EXPECTED_COMMIT_SHA"
          printf 'Expected commit: `%s`\n\nHealth, schema-compatible safe refresh, and composed alerts verified.\n' "$EXPECTED_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
